!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Panel</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.weather-card{
    background:white;
    width:320px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.city{
    font-size:24px;
    font-weight:bold;
}

.time{
    color:gray;
    margin-bottom:15px;
}

.temp{
    font-size:48px;
    font-weight:bold;
    margin:10px 0;
}

.condition{
    font-size:18px;
    color:#444;
}

.icon{
    font-size:50px;
}

.details{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.box{
    background:#f3f6fa;
    padding:10px;
    border-radius:10px;
    width:30%;
}

.label{
    font-size:12px;
    color:#777;
}

.value{
    font-weight:bold;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="weather-card">

<div class="city">Nagpur</div>
<div class="time" id="time"></div>

<div class="icon">☀️</div>
<div class="temp">32°C</div>
<div class="condition">Sunny</div>

<div class="details">

<div class="box">
<div class="label">Humidity</div>
<div class="value">45%</div>
</div>

<div class="box">
<div class="label">Wind</div>
<div class="value">10 km/h</div>
</div>

<div class="box">
<div class="label">Feels Like</div>
<div class="value">34°C</div>
</div>

</div>

</div>

<script>
function updateTime(){
let now=new Date();
document.getElementById("time").innerHTML=
now.toDateString()+" | "+now.toLocaleTimeString();
}

setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
