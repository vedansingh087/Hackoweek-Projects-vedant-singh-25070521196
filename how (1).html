<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology Quiz</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:#fff;
    width:100%;
    max-width:800px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    animation:fadeIn 0.5s ease-in-out;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.question{
    margin-bottom:20px;
}

.question p{
    font-weight:500;
    margin-bottom:10px;
}

label{
    display:block;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

label:hover{
    background:#f2f2f2;
}

input[type="radio"]{
    margin-right:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    opacity:0.9;
}

.result-box{
    text-align:center;
}

.score{
    font-size:26px;
    font-weight:600;
    margin:15px 0;
}

.grade{
    font-size:20px;
    margin-bottom:20px;
}

.hidden{
    display:none;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<!-- QUIZ SECTION -->
<div id="quizSection">
<h1>Technology Quiz</h1>

<div class="question">
<p>1. What does CPU stand for?</p>
<label><input type="radio" name="q1" value="a"> Central Processing Unit</label>
<label><input type="radio" name="q1" value="b"> Computer Personal Unit</label>
<label><input type="radio" name="q1" value="c"> Central Print Unit</label>
<label><input type="radio" name="q1" value="d"> Control Processing Unit</label>
</div>

<div class="question">
<p>2. Which language structures web pages?</p>
<label><input type="radio" name="q2" value="a"> Python</label>
<label><input type="radio" name="q2" value="b"> HTML</label>
<label><input type="radio" name="q2" value="c"> Java</label>
<label><input type="radio" name="q2" value="d"> C++</label>
</div>

<div class="question">
<p>3. What does RAM stand for?</p>
<label><input type="radio" name="q3" value="a"> Random Access Memory</label>
<label><input type="radio" name="q3" value="b"> Read Access Memory</label>
<label><input type="radio" name="q3" value="c"> Rapid Access Memory</label>
<label><input type="radio" name="q3" value="d"> Run Access Memory</label>
</div>

<div class="question">
<p>4. Which company developed Windows OS?</p>
<label><input type="radio" name="q4" value="a"> Apple</label>
<label><input type="radio" name="q4" value="b"> Microsoft</label>
<label><input type="radio" name="q4" value="c"> Google</label>
<label><input type="radio" name="q4" value="d"> IBM</label>
</div>

<div class="question">
<p>5. What does HTTP stand for?</p>
<label><input type="radio" name="q5" value="a"> HyperText Transfer Protocol</label>
<label><input type="radio" name="q5" value="b"> Hyper Tool Transfer Protocol</label>
<label><input type="radio" name="q5" value="c"> High Transfer Text Protocol</label>
<label><input type="radio" name="q5" value="d"> Hyperlink Transfer Program</label>
</div>

<button onclick="submitQuiz()">Submit Quiz</button>
</div>


<!-- RESULT SECTION -->
<div id="resultSection" class="hidden">
<h1>Quiz Result</h1>
<div class="result-box">
<div class="score" id="scoreText"></div>
<div class="grade" id="gradeText"></div>
<button onclick="retakeQuiz()">Retake Quiz</button>
</div>
</div>

</div>

<script>
function submitQuiz(){

let score = 0;

const answers = {
    q1:"a",
    q2:"b",
    q3:"a",
    q4:"b",
    q5:"a"
};

for(let key in answers){
    let selected = document.querySelector('input[name="'+key+'"]:checked');
    if(selected && selected.value === answers[key]){
        score += 5;
    }
}

let percentage = (score/25)*100;
let grade;

if(percentage >= 80) grade="Excellent 🌟";
else if(percentage >=60) grade="Good 👍";
else if(percentage >=40) grade="Average 🙂";
else grade="Needs Improvement ❌";

document.getElementById("scoreText").innerHTML = 
"Your Score: "+score+" / 25 ("+percentage+"%)";

document.getElementById("gradeText").innerHTML =
"Performance: "+grade;

document.getElementById("quizSection").classList.add("hidden");
document.getElementById("resultSection").classList.remove("hidden");
}

function retakeQuiz(){
location.reload();
}
</script>

</body>
</html>
